receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  transform/mark-collector:
    error_mode: ignore
    log_statements:
      - set(resource.attributes["collector.enabled"], "true")
    trace_statements:
      - set(resource.attributes["collector.enabled"], "true")
    metric_statements:
      - set(resource.attributes["collector.enabled"], "true")

exporters:
  debug:
    verbosity: normal
  otlp/aspire:
    endpoint: ${env:ASPIRE_ENDPOINT}
    headers:
      x-otlp-api-key: ${env:ASPIRE_API_KEY}
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, transform/mark-collector]
      exporters: [debug, otlp/aspire]
    metrics:
      receivers: [otlp]
      processors: [batch, transform/mark-collector]
      exporters: [otlp/aspire]
    logs:
      receivers: [otlp]
      processors: [batch, transform/mark-collector]
      exporters: [debug, otlp/aspire]
